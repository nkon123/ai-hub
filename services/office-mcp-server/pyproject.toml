[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "office-mcp-server"
version = "0.1.0"
description = "Enterprise AI Asset Hub — Office MCP Server (M10, READ_ONLY)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "jsonschema>=4.22.0",
  "ai-asset-schemas",
  "security-policy",
  "observability",
]

[tool.hatch.build.targets.wheel]
packages = ["src/office_mcp_server"]

[tool.uv.sources]
ai-asset-schemas = { workspace = true }
security-policy = { workspace = true }
observability = { workspace = true }
