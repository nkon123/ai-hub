[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distribution-service"
version = "0.1.0"
description = "Enterprise AI Asset Hub — Distribution & Bundle Service (M03)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "ai-asset-schemas",
  # bundle-manifest.yaml / profiles/office-profile.yaml serialization (§4.2).
  # Already resolved in uv.lock (pulled transitively today via
  # ai-asset-schemas -> packages/schemas, which depends on it for manifest
  # fixtures); declared directly here too since distribution-service uses it
  # in its own code, not just through that transitive dependency. Offline
  # install: same PyPI mirror cache as the rest of the workspace (D-031),
  # `uv sync --offline` picks up the already-locked version.
  "pyyaml>=6.0.1",
  "observability",
]

[tool.hatch.build.targets.wheel]
packages = ["src/distribution_service"]

[tool.uv.sources]
ai-asset-schemas = { workspace = true }
observability = { workspace = true }
