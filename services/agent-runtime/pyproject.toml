[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "Enterprise AI Asset Hub — Agent Runtime (M05)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "jsonschema>=4.22.0",
  "ai-asset-schemas",
  "security-policy",
  "observability",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.uv.sources]
ai-asset-schemas = { workspace = true }
security-policy = { workspace = true }
observability = { workspace = true }
