[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "Enterprise AI Asset Hub — Agent Runtime (M05)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "jsonschema>=4.22.0",
  # D-094: 공식 MCP SDK. 직접 구현하지 않는 이유는 이 기능의 목적이 **남이 만든
  # 서버와의 상호운용**이고, JSON-RPC 프레이밍과 initialize/lifecycle 을 손으로
  # 재구현하면 정확히 거기서 어긋나기 때문이다(그 어긋남은 상대 서버에서만
  # 드러나 이쪽 테스트로는 안 잡힌다).
  #
  # 폐쇄망 설치: 인터넷이 되는 빌드 머신에서
  #   pip download mcp -d vendor/wheels --platform win_amd64 \
  #       --python-version 3.11 --only-binary=:all:
  # 로 wheel 을 받아 반입한 뒤
  #   pip install --no-index --find-links vendor/wheels mcp
  # 로 설치한다. 전이 의존성은 8개이며(PyJWT, httpcore2, httpx2, mcp-types,
  # pywin32, sse-starlette, truststore, mcp 자신) 나머지는 이 서비스가 이미
  # 갖고 있는 것으로 충족된다 — 2026-09-16 `pip install --dry-run` 실측.
  "mcp>=2.2.0",
  "ai-asset-schemas",
  "security-policy",
  "observability",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.uv.sources]
ai-asset-schemas = { workspace = true }
security-policy = { workspace = true }
observability = { workspace = true }
