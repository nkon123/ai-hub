[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-asset-schemas"
version = "0.1.0"
description = "JSON Schema definitions and validator CLI for Enterprise AI Asset Hub"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22.0",
  "referencing>=0.35.0",
  "click>=8.1.0",
  "pyyaml>=6.0.1",
  "openapi-spec-validator>=0.7.1",
]

[project.scripts]
validate-manifest = "ai_asset_schemas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_asset_schemas"]
