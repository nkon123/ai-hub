openapi: "3.1.0"
info:
  title: Local Agent Runtime API
  version: "0.1.0"
  description: |
    Desktop Local Runtime API (M05) — loopback-only, 127.0.0.1:8100.
    Desktop Client communicates with this API for local agent execution.

servers:
  - url: http://127.0.0.1:8100
    description: Loopback only — not exposed to network

paths:
  /health:
    get:
      summary: Runtime health check
      operationId: health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /local/v1/health:
    get:
      summary: Detailed health with component status
      operationId: detailed_health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedHealthResponse"

  /local/v1/services:
    get:
      summary: List installed services
      operationId: list_services
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"

  /local/v1/services/{service_id}/preflight:
    post:
      summary: Preflight check for a service
      operationId: preflight_service
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Preflight result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightResult"

  /local/v1/runs:
    post:
      summary: Start agent run
      operationId: start_run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"

  /local/v1/runs/{run_id}:
    get:
      summary: Get run status
      operationId: get_run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"

  /local/v1/runs/{run_id}/cancel:
    post:
      summary: Cancel run
      operationId: cancel_run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Cancelled

  /local/v1/runs/{run_id}/confirm:
    post:
      summary: >
        Resolve a Run parked in WAITING_FOR_USER (02-desktop-and-agent-runtime.md
        §5.3) with an explicit approve/deny decision for the MCP Tool call
        awaiting confirmation (D-052 후속). Denial is not an error — the Run
        continues (or ends via the existing INSUFFICIENT_EVIDENCE/SUCCEEDED
        paths) exactly as if the Tool had never been requested.
      operationId: confirm_run
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRunRequest"
      responses:
        "200":
          description: Decision accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "404":
          description: Run not found
        "409":
          description: >
            Run is not currently WAITING_FOR_USER (already resolved, expired,
            or otherwise terminal/running) — decision rejected, not applied.

  /local/v1/runs/{run_id}/events:
    get:
      summary: SSE event stream for run
      operationId: run_events_stream
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RuntimeSSEEvent"

  /local/v1/mcp-tools:
    post:
      summary: >
        D-080 — register an installed MCP Tool asset's input_schema/
        confirmation_policy so ANALYZE (`agent_runtime.mcp_tools
        .validate_tool_input`) recognizes it. Full contract, including the
        complete refusal reason list and the safety boundary this endpoint
        enforces (registration can only describe permission the active
        Office Profile already grants — it can never widen it):
        `packages/schemas/api/mcp-tool-registration.schema.json`.
      operationId: register_mcp_tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMcpToolRequest"
      responses:
        "200":
          description: Registered and immediately usable by ANALYZE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterMcpToolResponse"
        "400":
          description: >
            Malformed registration (VALIDATION_ERROR) — see the schema
            file's reason list.
        "403":
          description: >
            Refused by deployment policy (PERMISSION_DENIED) — includes the
            two refusals that would otherwise turn this feature into a
            vulnerability: `tool_not_in_server_allowlist` (the Office
            Profile does not already permit this tool) and
            `confirmation_policy_weaker_than_builtin` (an attempt to loosen
            a built-in Tool's confirmation requirement).
    get:
      summary: List currently-active MCP Tool registrations
      operationId: list_mcp_tools
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMcpToolsResponse"

  /local/v1/mcp-tools/{tool_name}:
    delete:
      summary: Deregister an MCP Tool (safe to call unconditionally on uninstall)
      operationId: deregister_mcp_tool
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK (removed=false when nothing was registered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeregisterMcpToolResponse"

  /local/v1/knowledge-metadata-suggest:
    post:
      summary: >
        Suggest a Knowledge 등록 name/description from a bounded text
        excerpt of the document the caller is about to register. A
        narrow, single-purpose endpoint — NOT a general-purpose
        text-generation route (구현 원칙 7: 승인되지 않은 임의 Python 실행,
        외부 URL, Package 설치 기능을 만들지 않는다 — the same "no open
        surface" reasoning extends to a free-form prompt passthrough).
        Never touches `/local/v1/runs*`, `RunStore`, or the D-036
        hallucination guard — this is a single non-streaming completion, not
        a Run.

        The excerpt is client-extracted text (portal-web reads .md/.txt
        client-side); this endpoint does not receive or parse the original
        file. The suggestion is always a suggestion — the caller (portal-web)
        must land it in editable fields, never auto-submit it.
      operationId: suggest_knowledge_metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestKnowledgeMetadataRequest"
      responses:
        "200":
          description: OK — a suggestion, not a fact; caller must present it as editable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestKnowledgeMetadataResponse"
        "400":
          description: VALIDATION_ERROR — empty excerpt after trimming.
        "503":
          description: >
            MODEL_UNAVAILABLE — the underlying LLM (Ollama) could not be
            reached or failed. Registration itself never depends on this
            endpoint succeeding. When the specific cause is that the
            configured `model_id` is not installed on the Ollama instance
            (Ollama's own /api/chat 404 for this reason, D-091,
            open-decisions.md), `message` names the missing `model_id` and
            the office-profile `model_aliases` key it came from, and points
            at `ollama pull <model_id>` or the `AGENT_RUNTIME_CHAT_MODEL_ID`
            override — this is distinguishable only via `message` text, not
            a separate error code.

  /local/v1/models:
    get:
      summary: >
        List installed Ollama chat models, and report which model_id
        `default-chat` actually resolves to right now (D-092,
        open-decisions.md). Mirrors indexing-runtime's
        `GET /indexing/v1/models` response shape (embedding models) exactly,
        with chat-specific field names — portal-api's admin screen (P15)
        calls this endpoint over HTTP rather than talking to Ollama itself
        (root CLAUDE.md: "Portal API는 모델을 직접 호출하지 않는다"), since
        this service already owns the Ollama relationship for chat
        completions.
      operationId: list_chat_models
      responses:
        "200":
          description: >
            OK. `models: []` means Ollama answered but has zero models
            installed — a real, different state from the 503 below, and
            callers must not collapse the two.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatModelsResponse"
        "503":
          description: >
            MODEL_UNAVAILABLE — Ollama itself could not be reached (distinct
            from "reached it, zero models installed", the 200 case above).

components:
  parameters:
    ServiceId:
      name: service_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]

    DetailedHealthResponse:
      allOf:
        - $ref: "#/components/schemas/HealthResponse"
        - type: object
          properties:
            components:
              type: object
              properties:
                ollama:
                  type: object
                  properties:
                    status:
                      type: string
                    model_loaded:
                      type: boolean
                chroma:
                  type: object
                  properties:
                    status:
                      type: string
                mcp:
                  type: object
                  properties:
                    status:
                      type: string

    ServiceListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              service_id:
                type: string
                format: uuid
              name:
                type: string
              version:
                type: string
              status:
                type: string
                enum: [ACTIVE, INACTIVE, INVALID, QUARANTINED, REVOKED]

    PreflightResult:
      type: object
      required: [passed, checks]
      properties:
        passed:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              passed:
                type: boolean
              message:
                type: string

    StartRunRequest:
      type: object
      required: [service_id, input]
      properties:
        service_id:
          type: string
          format: uuid
        input:
          type: object
          description: >
            Free-form run input (`knowledge_id`, `question`, and the
            agent/MCP selection fields documented in workflow.py/routers/
            runs.py remain undocumented here for now — this schema is
            intentionally not `additionalProperties: false`). `history` is
            documented explicitly below (Desktop 대화 고도화, additive/
            optional) because it is new: prior conversation turns, oldest
            or newest first (server-side bounding does not depend on
            order), so a follow-up question can be answered/searched with
            context. Omitting it reproduces the exact single-turn behavior
            every existing caller already gets — growth is bounded
            server-side (`AgentRuntimeSettings.max_history_turns`/
            `max_history_chars`), not by anything the caller sends.
            `knowledge_ids` and `allow_hub_lookup` are documented explicitly
            below (additive/optional) because they are new: `knowledge_ids`
            fans Stage 1 Knowledge search out across every id in the list
            (against this machine's LOCAL search-runtime only) instead of
            the single `knowledge_id` field; omitting it reproduces the
            single-`knowledge_id` behavior exactly. `allow_hub_lookup`
            (default `false`) opts a Run into Stage 2 — a lookup against the
            CENTRAL hub Knowledge registry (portal-api
            `POST /api/v1/knowledge-search`, a different network/trust
            boundary than this machine) — which only ever runs when Stage 1
            found zero citations. The hub query is built server-side ONLY
            from the caller-typed `question` and prior turns'
            `history[].question` fields — NEVER `history[].answer`, local
            citations, or the local (possibly rewritten) search query — see
            `agent_runtime.hub_query` in services/agent-runtime.
            `knowledge_candidates` (additive/optional) enables agentic
            Knowledge selection — the KNOWLEDGE_ROUTE stage
            (`agent_runtime.knowledge_router`), which runs before
            KNOWLEDGE_SEARCH and takes over id selection from
            `knowledge_ids` entirely when present. One optional LLM call
            reads ONLY the current `question` and each candidate's
            metadata — never document text, citations, or prior turns'
            `history[].answer` — and returns the subset worth searching,
            each with a short Korean reason. At/below a server-side
            threshold the LLM call is skipped (every candidate is
            searched); on any routing failure, an id the router invented,
            or a valid-but-empty selection, the Run fails open and searches
            every candidate — never zero, never a guessed-at subset. The
            decision is emitted as a `knowledge.route.selected` event.
            Omitting `knowledge_candidates` (every caller today, including
            the 4 published Hosted chatbots) reproduces the exact prior
            `knowledge_ids`/`knowledge_id` behavior byte-for-byte.
            `tool_route` (D-083, open-decisions.md, additive/optional,
            default `false`) enables agentic MCP Tool selection — the
            TOOL_ROUTE stage (`agent_runtime.tool_router`) — ONLY when
            `mcp_tool`/`mcp_tool_input` above were NOT already supplied (an
            explicit caller-declared tool always wins) and the resolved
            agent allows MCP (`capabilities.mcp_allowed`). Candidates are
            computed server-side from the Office Profile alone — never from
            anything on this request — so routing can only ever narrow what
            the deployment already permits, never widen it. One optional LLM
            call reads ONLY `question` and each candidate tool's name/input
            schema — never Knowledge citations, tool results, or `history` —
            and proposes at most one tool name + arguments. The proposal
            still goes through the exact same allowlist/schema/confirmation
            checks an explicit `mcp_tool` request goes through, unchanged;
            unlike `knowledge_candidates` above, a routing failure (timeout,
            unparseable output, an unknown tool name, or the model declining)
            fails CLOSED — no tool is called at all, never a guessed one —
            because a Tool Call is an action, not a read. The decision is
            emitted as an `mcp.tool_route.selected` event (never the raw
            prompt or model output). Omitting `tool_route` (every caller
            today, including the 4 published Hosted chatbots) reproduces the
            exact prior `mcp_tool`-only behavior byte-for-byte.
          properties:
            history:
              type: array
              items:
                $ref: "#/components/schemas/ConversationTurnInput"
            knowledge_ids:
              type: array
              items:
                type: string
            knowledge_candidates:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgeCandidateInput"
            allow_hub_lookup:
              type: boolean
              default: false
            tool_route:
              type: boolean
              default: false
        trace_id:
          type: string
        user_context:
          type: object

    RunResponse:
      type: object
      required: [id, status, trace_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED, PREFLIGHT, RUNNING, WAITING_FOR_USER, SUCCEEDED, FAILED, CANCELLED, INSUFFICIENT_EVIDENCE]
        output:
          type: object
        error:
          type: object
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        pending_confirmation:
          type: object
          description: >
            Present only while status is WAITING_FOR_USER — a safe,
            human-readable (Korean) summary of the MCP Tool call awaiting
            approval. Never contains the raw tool input or result (same
            property `mcp.call.*` events already hold, D-052 후속).
          properties:
            tool_name:
              type: string
            summary:
              type: string
            deadline:
              type: string
              format: date-time

    ConfirmRunRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]

    ConversationTurnInput:
      type: object
      description: >
        One prior turn of a conversation (Desktop 대화 고도화). Both fields
        are treated as untrusted end-user-controlled text — same trust
        boundary as `input.question` itself — and NEVER influence the
        Hallucination Guard (0 Knowledge citations still yields
        INSUFFICIENT_EVIDENCE regardless of history).
      properties:
        question:
          type: string
        answer:
          type: string

    KnowledgeCandidateInput:
      type: object
      description: >
        One Knowledge asset offered to the KNOWLEDGE_ROUTE stage for
        agentic selection (`agent_runtime.knowledge_router`). Metadata
        only — never document text, chunks, or citations; that data is
        never sent into the routing LLM call.
      required: [knowledge_id]
      properties:
        knowledge_id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        classification:
          type: string
        retrieval_profile:
          type: object
          additionalProperties: false
          description: |
            Resolved per-Knowledge search settings copied from that installed
            Knowledge manifest. It may tune ranking/top_k/relevance only and
            never carries access_context or identity fields.
          properties:
            strategy:
              type: string
              enum: [balanced_hybrid, keyword_priority, semantic_priority]
            top_k:
              type: integer
              minimum: 1
              maximum: 50
            hybrid_alpha:
              type: number
              minimum: 0
              maximum: 1
            min_relevance_score:
              type: number
              minimum: 0
              maximum: 1
            enable_parent_expansion:
              type: boolean

    MCPConfirmationPolicy:
      type: string
      enum: [NEVER, ON_PARAMETER, ALWAYS]

    MCPToolRiskLevel:
      type: string
      enum: [READ_ONLY]

    MCPToolRegistrationEntry:
      type: object
      required: [tool_name, server_alias, input_schema, confirmation_policy, risk_level, registered_at]
      properties:
        tool_name:
          type: string
        server_alias:
          type: string
          description: >
            Must already name an entry in office-profile.json's
            allowed_mcp_servers. NOT an endpoint/URL.
        input_schema:
          type: object
        confirmation_policy:
          $ref: "#/components/schemas/MCPConfirmationPolicy"
        risk_level:
          $ref: "#/components/schemas/MCPToolRiskLevel"
        label:
          type: string
          nullable: true
        registered_at:
          type: string
          format: date-time

    RegisterMcpToolRequest:
      type: object
      description: >
        D-080. Deliberately has no endpoint/server_url/connector field of
        any kind — the network destination a call dispatches to always
        comes from office-profile.json, never from this payload (구현
        원칙 7). See mcp-tool-registration.schema.json for the full
        refusal reason list this request can trigger.
      required: [tool_name, server_alias, input_schema, confirmation_policy, risk_level]
      properties:
        tool_name:
          type: string
        server_alias:
          type: string
        input_schema:
          type: object
        confirmation_policy:
          $ref: "#/components/schemas/MCPConfirmationPolicy"
        risk_level:
          $ref: "#/components/schemas/MCPToolRiskLevel"
        label:
          type: string
          nullable: true
        trace_id:
          type: string
          nullable: true

    RegisterMcpToolResponse:
      type: object
      required: [entry, trace_id]
      properties:
        entry:
          $ref: "#/components/schemas/MCPToolRegistrationEntry"
        trace_id:
          type: string

    ListMcpToolsResponse:
      type: object
      required: [entries, mcp_tool_registration_enabled, trace_id]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MCPToolRegistrationEntry"
        mcp_tool_registration_enabled:
          type: boolean
        trace_id:
          type: string

    DeregisterMcpToolResponse:
      type: object
      required: [tool_name, removed, trace_id]
      properties:
        tool_name:
          type: string
        removed:
          type: boolean
        trace_id:
          type: string

    RuntimeSSEEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          enum:
            - run.started
            - preflight.completed
            - knowledge.route.selected
            - knowledge.search.started
            - knowledge.search.completed
            - knowledge.query_rewritten
            - hub.query_sent
            - hub.search.completed
            - mcp.call.started
            - mcp.call.completed
            - mcp.confirmation_required
            - mcp.confirmation_resolved
            - mcp.confirmation_expired
            - answer.delta
            - citation.added
            - run.completed
            - run.failed
            - run.cancelled
        data:
          type: object
        id:
          type: string

    SuggestKnowledgeMetadataRequest:
      type: object
      required: [excerpt, filename]
      properties:
        excerpt:
          type: string
          minLength: 1
          description: >
            Client-extracted plain text from the beginning of the document
            (never the full document). The server bounds this further to
            `AgentRuntimeSettings.knowledge_metadata_suggest_excerpt_max_chars`
            (truncated silently if longer, never rejected for being too
            long) — never logged (root CLAUDE.md 코드 규칙: 로그에 Prompt
            원문/문서 전체 저장 금지).
        filename:
          type: string
          description: Original filename, shown to the model as weak context only.
        trace_id:
          type: string

    SuggestKnowledgeMetadataResponse:
      type: object
      required: [suggested_name, suggested_description, trace_id]
      properties:
        suggested_name:
          type: string
          description: >
            Model-generated suggestion for 지식 명. Untrusted model output —
            the caller must render it as editable text only, never execute
            it, never use it to build a file path, never resubmit it as an
            instruction.
        suggested_description:
          type: string
        trace_id:
          type: string

    ChatModelInfo:
      type: object
      required: [name, chat_capable]
      properties:
        name:
          type: string
          description: Ollama model name/tag as returned by `/api/tags` (e.g. `exaone3.5:7.8b`).
        chat_capable:
          type: boolean
          description: >
            Best-effort naming-convention heuristic (see
            `agent_runtime.ollama_models.is_chat_capable`'s docstring for the
            exact rule and its known false-positive/negative shape) —
            `false` only for models that look like a well-known
            embedding-only naming convention (e.g. `qwen3-embedding:0.6b`).
            A display hint to steer an operator away from an obviously-wrong
            pick; NEVER used to filter `models` — an uncertain model is
            still listed.
        size:
          type: integer
          nullable: true
        modified_at:
          type: string
          nullable: true

    ChatModelsResponse:
      type: object
      required: [models, default_chat_model, source, trace_id]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ChatModelInfo"
          description: >
            May be an empty array — Ollama reachable but zero models
            installed, a real and different state from the 503
            MODEL_UNAVAILABLE response (Ollama unreachable). Callers must
            not render these two states identically.
        default_chat_model:
          type: string
          nullable: true
          description: >
            The `model_id` `default-chat` actually resolves to right now
            (D-092 priority: Portal admin setting >
            `AGENT_RUNTIME_CHAT_MODEL_ID` > office-profile.json) — never a
            value that isn't really in effect.
        source:
          type: string
          description: The Ollama endpoint URL this list came from (e.g. `http://127.0.0.1:11434/api/tags`).
        trace_id:
          type: string
