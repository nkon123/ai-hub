openapi: "3.1.0"
info:
  title: Enterprise AI Asset Hub — Portal API
  version: "0.1.0"
  description: |
    Portal API (M02) — Asset Registry, Service Composer, Deployment Management.
    This is a draft contract. Implementation starts in Phase 1.

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: assets
  - name: reviews
  - name: services
  - name: deployments
  - name: distributions
  - name: audit
  - name: evaluations
  - name: knowledge-search
  - name: runtime-models

paths:
  /health:
    get:
      summary: Health check
      operationId: health_check
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/assets:
    get:
      tags: [assets]
      summary: Search assets
      operationId: list_assets
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [agent, knowledge, prompt, mcp_tool, service]
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AssetStatus"
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [assets]
      summary: Register new asset
      operationId: create_asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetVersion"
        "400":
          description: >
            `VALIDATION_ERROR` — the manifest does not satisfy its type's
            schema (`error.details.errors` carries the validator messages).
            Distinct from that, uploaded files are checked against
            `GET /api/v1/assets/upload-policy`'s limits and rejected with one
            of four upload-specific codes, checked in this order:
            `ASSET_UPLOAD_TOO_MANY_FILES` (file count over
            `max_file_count`, checked before any file is read),
            `ASSET_UPLOAD_EXTENSION_REJECTED` (a file's extension is in
            `rejected_extensions`, checked before any bytes of that file are
            written), `ASSET_UPLOAD_FILE_TOO_LARGE` (bytes actually read for
            one file exceed `max_single_file_bytes`), and
            `ASSET_UPLOAD_REQUEST_TOO_LARGE` (cumulative bytes actually read
            across all files exceed `max_total_request_bytes`). All four are
            computed from bytes streamed off the wire, never from
            `Content-Length` — a forged header cannot bypass them. None of
            these four are retryable without changing the upload itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/assets/upload-policy:
    get:
      tags: [assets]
      summary: Get inbound asset-upload limits (size/count/extension)
      description: |
        Read-only upload limits enforced by `POST /api/v1/assets` — max
        single file size, max total request size, max file count, rejected
        extensions. Lets the registration screens (P05, P12) show these
        limits before the user picks files, and validate client-side before
        submitting. Gated on the same permission as `POST /api/v1/assets`
        (`ASSET_CREATE`) since anyone who can register an asset needs to see
        its limits; this is a narrower, non-admin-gated view of the same
        four numbers `GET /api/v1/admin/settings` already exposes to ADMIN.
        Registered before `/api/v1/assets/{asset_id}` so the literal path is
        not shadowed by that route's single-segment catch-all.
      operationId: get_asset_upload_policy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUploadPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/assets/{asset_id}:
    get:
      tags: [assets]
      summary: Get asset detail with versions
      operationId: get_asset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/assets/{asset_id}/versions:
    post:
      tags: [assets]
      summary: 새 버전 만들기 — 최신 승인(APPROVED) 버전에서 새 DRAFT를 만든다 (P06)
      description: |
        Source manifest와 저장소 디렉터리를 그대로 복사한다. `version`은 소스
        버전보다 SemVer상 더 커야 하며(major.minor.patch), 그렇지 않으면
        VALIDATION_ERROR로 거부한다. 승인된 버전이 없으면
        ASSET_STATE_TRANSITION_INVALID(409)로 거부한다. 호출자는 자산
        소유자(CREATOR) 본인 또는 ADMIN만 가능하다.
      operationId: create_asset_version
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetVersionRequest"
      responses:
        "201":
          description: Created (DRAFT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetVersion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No APPROVED source version, or the requested version already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/assets/{asset_id}/versions/{version_id}:
    patch:
      tags: [assets]
      summary: Changelog와 편집 가능한 Manifest 필드(설명/태그) 수정 (P06)
      description: |
        DRAFT/CHANGES_REQUESTED 상태에서만 허용된다. APPROVED 이후 버전을
        수정하려는 시도는 ASSET_STATE_TRANSITION_INVALID(409)로 거부한다
        ("승인 버전 수정 금지"). 수정에 성공하면 이전 자동검증 결과는
        무효화되어 `validation_status`가 `NOT_RUN`으로 재설정된다.
      operationId: update_asset_version
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetVersionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetVersion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version is not editable (not DRAFT/CHANGES_REQUESTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/assets/{asset_id}/versions/{version_id}/validate:
    post:
      tags: [assets]
      summary: 자동검증 재실행 (P06) — ai_asset_schemas의 공개 Validator API만 사용
      description: |
        결과는 상태 전이가 아니라 `validation_status`(NOT_RUN/PASSED/FAILED),
        `validation_errors`, `validated_at`에만 기록된다 — 이 PoC의 상태
        머신(packages/security-policy)에는 실패 상태가 없다: 실패해도 버전은
        DRAFT/CHANGES_REQUESTED에 그대로 머문다.
      operationId: validate_asset_version
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: 검증 완료 (통과 여부와 무관하게 200 — 결과는 응답 바디의 validation_status로 구분)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetVersion"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version is not validatable (not DRAFT/CHANGES_REQUESTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/assets/{asset_id}/versions/{version_id}/diff:
    get:
      tags: [assets]
      summary: 이전 버전과 Manifest/Dependency/Permission Diff (P06)
      description: |
        세 축을 별도 Section으로 반환한다(하나의 flat blob이 아님) — UI가
        직접 Diff를 재구현하지 않도록 서버가 added/removed/changed로 이미
        분류해 돌려준다. 이 PoC에는 §3.4 Dependency Entity나 필드 단위 권한
        모델이 없어(D-034), Manifest의 알려진 Key 이름을 세 축으로 분류하는
        조작적 정의를 사용한다 — 자세한 내용은
        `apps/portal-api/src/portal_api/diffing.py` 참고.
      operationId: diff_asset_version
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/VersionId"
        - name: against
          in: query
          required: true
          description: 비교 대상(base) 버전 id — 같은 자산의 버전이어야 한다
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDiff"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/assets/{asset_id}/versions/{version_id}/search-preview:
    post:
      tags: [knowledge-diagnostics]
      summary: 검색 품질 테스트 — 이 질문을 하면 실제로 무엇이 검색되는가 (retrieval preview, D-079)
      description: |
        Producer용 검색 단계 진단이다. 이미 있는 정적 청크 미리보기/평가
        지표와 달리, 실제 질의를 search-runtime에 보내 어떤 청크가 어떤
        점수로 검색되는지 보여준다 — LLM 응답이 아니다(그건 챗봇 Quick
        Create Wizard의 몫). 승인되지 않은 버전에도 동작한다(승인 전 확인이
        이 기능의 목적이다).

        요청 Body에 `metadata_filters`/`access_context`/`retrieval_profile`이
        의도적으로 없다 — 04-knowledge-platform.md §3.8이 금지하는 ACL
        Override 표면을 만들지 않기 위해서다. `ignore_relevance_threshold:
        true`는 search-runtime에 `min_relevance_score: 0`만 추가로 보낼 뿐,
        ACL/Classification 필터링은 절대 완화하지 않는다.

        `knowledge_id`로는 `asset_id`가 아니라 이 경로의 `version_id`
        (AssetVersion id)를 그대로 사용한다(D-060).
      operationId: search_preview
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchPreviewRequest"
      responses:
        "200":
          description: OK (인용문이 0개여도 200 — `diagnostics.no_result_reason`으로 구분)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPreviewResponse"
        "400":
          description: 잘못된 요청이거나, 이 자산이 Knowledge 유형이 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: KNOWLEDGE_SEARCH_UNAVAILABLE — search-runtime에 연결할 수 없거나 오류를 반환함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/assets/{asset_id}/versions/{version_id}/distribution-readiness:
    get:
      tags: [knowledge-diagnostics]
      summary: 반출 준비 상태 점검 — 이 버전이 Desktop에서 실제로 활성화될지 예측 (D-079)
      description: |
        Offline Bundle ZIP을 만들기 전에, 이 버전의 색인이 설치 후
        search-runtime의 `POST /search/v1/local-indexes`(D-079) 등록을
        통과해 실제로 검색 가능해질지 미리 점검한다. 읽기 전용이며 아무것도
        만들지 않는다 — 기존 반출(Distribution ZIP 생성) 흐름을 막지 않는다.

        색인 디렉터리는 `GET /api/v1/assets/{asset_id}/knowledge-info`와
        정확히 같은 방식으로 해석한다(portal-api는 두 번째 해석 경로를
        만들지 않는다). `checks[].activation_reason`은
        `packages/schemas/api/knowledge-local-index.schema.json`의
        `RegisterLocalIndexResponse`가 문서화한 거절 사유 어휘 그대로이며,
        `services/search-runtime`의 코드를 Import하지 않는다 — 두 서비스가
        공유하는 것은 이 Schema 파일뿐이다.
      operationId: distribution_readiness
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: OK (`ready`는 FAIL인 check가 하나도 없을 때만 true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionReadinessResponse"
        "400":
          description: 이 자산이 Knowledge 유형이 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/my/assets:
    get:
      tags: [assets]
      summary: 내 자산 — 호출자가 소유한 Asset의 버전을 6개 구분으로 묶어 반환 (P07)
      description: |
        구분: 작성 중(IN_PROGRESS)/자동검증 실패(VALIDATION_FAILED)/검토
        대기(PENDING_REVIEW)/반려(REJECTED)/승인됨(APPROVED)/지원 종료
        예정(DEPRECATED). SUSPENDED/RETIRED 버전은 P16 화면 소관이라 이 목록에
        포함하지 않는다. ADMIN은 전체 소유자의 버전을 보고, 그 외 역할은
        자신이 owner인 Asset의 버전만 본다.
      operationId: list_my_assets
      responses:
        "200":
          description: OK (모든 구분을 항상 포함, 비어 있으면 items가 빈 배열)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAssetsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/assets/{asset_id}/versions/{version_id}/evaluations:
    get:
      tags: [evaluations]
      summary: List Knowledge search quality evaluations for this AssetVersion, newest first (P12)
      operationId: list_evaluations
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: OK (empty items[] if none have been run yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [evaluations]
      summary: Run a Knowledge search quality evaluation as a background job (TECH_REVIEWER/SECURITY_REVIEWER/ADMIN, or the owning CREATOR)
      operationId: create_evaluation
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "202":
          description: Evaluation job accepted (PENDING — processing continues asynchronously)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEvaluationResponse"
        "400":
          description: Not indexed yet, or no Evaluation Dataset registered for this Knowledge Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/evaluations/{evaluation_id}:
    get:
      tags: [evaluations]
      summary: Get one evaluation's status/metrics/gate/per-case detail, comparison to the previous version, and reviewer notes (P12). The stored result carries no document content, so per_case is never masked today — see source_masking_note.
      operationId: get_evaluation
      parameters:
        - $ref: "#/components/parameters/EvaluationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/evaluations/{evaluation_id}/notes:
    post:
      tags: [evaluations]
      summary: Record a 기준 미달 사유 (quality gate failure reason) on an evaluation (TECH_REVIEWER/SECURITY_REVIEWER/ADMIN only)
      operationId: create_evaluation_note
      parameters:
        - $ref: "#/components/parameters/EvaluationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvaluationNoteRequest"
      responses:
        "201":
          description: Note recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationNote"
        "400":
          description: Empty reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/asset-versions/{version_id}:
    get:
      tags: [assets]
      summary: Get a single AssetVersion (manifest, status) by id
      description: |
        07-data-api-contracts.md §3.2 lists this as a required API ("버전·
        Manifest·의존성") — previously undocumented-as-missing (D-066) and
        unimplemented. D-034's agent-runtime Registry resolution (M05) is the
        first real consumer: given an explicit `registry_agent_version_id`/
        `registry_prompt_version_id`, agent-runtime calls this endpoint (with
        a PoC service-identity Bearer token, D-001) to fetch the manifest and
        check `status == APPROVED` before using it for execution. Returns the
        manifest regardless of status — approval gating is the caller's
        responsibility, same precedent as `get_asset`.
      operationId: get_asset_version
      parameters:
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/asset-versions/{version_id}/template:
    get:
      tags: [assets]
      summary: Get a PROMPT asset version's template file content
      description: |
        D-034: agent-runtime's Registry resolution needs the Prompt's actual
        template markdown (`manifest.template.file`), not just the manifest
        JSON. Scoped to `type == "prompt"` only — every other asset type
        404s. Deliberately not a generic by-filename file server (that would
        also expose full Knowledge document text to any ASSET_READ caller).
      operationId: get_prompt_template
      parameters:
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/knowledge-search:
    post:
      tags: [knowledge-search]
      summary: Search across every Knowledge asset the caller may see (Hub Search)
      description: |
        `services/search-runtime` (M08) only ever searches one `knowledge_id`
        per request. This is the missing cross-Knowledge capability:
        portal-api (M02) resolves the caller's visible APPROVED Knowledge
        AssetVersions from its own Registry, fans out concurrently to
        search-runtime per Knowledge, and merges/re-ranks the results —
        mirroring `POST /api/v1/distributions`'s division of labor (M02
        owns auth/ACL/audit, the downstream service does the work).

        Deliberately absent from the request body: any ACL/clearance/
        classification/metadata_filters override field. There is no surface
        for a caller to widen its own access — the clearance asserted to
        search-runtime on every fan-out call is derived entirely
        server-side from the authenticated caller
        (`Settings.default_search_clearance`, D-062), never from this
        request.
      operationId: knowledge_search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchRequest"
      responses:
        "200":
          description: |
            OK. Always 200 for a normal empty result (no APPROVED Knowledge
            visible, or none of the requested `knowledge_ids` were
            visible) — that is not an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: |
            KNOWLEDGE_SEARCH_UNAVAILABLE — search-runtime was unreachable
            for every targeted Knowledge. Partial failure (some Knowledge
            succeed, some fail) is not an error — the response degrades to
            only the succeeded Knowledge's citations with a 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/knowledge/suggest-metadata:
    post:
      tags: [knowledge-search]
      summary: AI 추천 — suggest a 지식 명/설명 from a document excerpt (P12 등록 화면)
      description: |
        Thin, stateless passthrough to `agent-runtime`'s
        `POST /local/v1/knowledge-metadata-suggest` — root CLAUDE.md UI
        구현 규칙 "Portal API는 모델을 직접 호출하지 않는다" means portal-api
        never calls Ollama itself; it only relays this bounded request the
        same way `routers/knowledge_search.py` relays search-runtime calls.
        Stores nothing, gated by `ASSET_CREATE` (registering a Knowledge
        asset already requires this permission). Field names match
        `local-runtime-api.yaml#/components/schemas/
        SuggestKnowledgeMetadataRequest` /`...Response` exactly.

        The result is always a suggestion — portal-web must land it in
        editable fields, never auto-submit, never overwrite text the user
        already typed without an explicit user action. Registration itself
        never depends on this endpoint succeeding.
      operationId: suggest_knowledge_metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestKnowledgeMetadataRequest"
      responses:
        "200":
          description: OK — a suggestion, not a fact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestKnowledgeMetadataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: >
            KNOWLEDGE_METADATA_SUGGEST_UNAVAILABLE — agent-runtime (or its
            underlying model) could not be reached. Registration itself is
            unaffected; the caller should fall back to manual entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/knowledge/extract-text:
    post:
      tags: [knowledge-search]
      summary: AI 추천 — extract a bounded plain-text excerpt from a .pdf/.docx upload (P12 등록 화면)
      description: |
        Thin, stateless passthrough to `indexing-runtime`'s
        `POST /indexing/v1/extract-text` — root CLAUDE.md UI 구현 규칙
        "Portal API는 모델을 직접 호출하지 않는다"의 연장으로, portal-api는
        문서 파싱도 직접 하지 않는다(그 책임은 indexing-runtime의 `loaders/`가
        소유, D-073). `.md`/`.txt`는 portal-web이 client-side에서 직접 읽어
        `POST /api/v1/knowledge/suggest-metadata`로 바로 보낸다 — 이 엔드포인트는
        브라우저가 파싱할 수 없는 `.pdf`/`.docx`에만 쓰인다. 반환된 `excerpt`는
        그대로 `suggest-metadata`에 넘기는 입력으로만 쓰인다(그 자체가 최종
        결과가 아니다). Stores nothing: 업로드된 파일 bytes와 excerpt 어느
        것도 DB에 쓰거나 감사 메타데이터에 남기지 않는다. Gated by
        `ASSET_CREATE`(Knowledge 자산 등록과 동일 권한).
      operationId: extract_knowledge_text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK — a bounded plain-text excerpt, not the whole document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractKnowledgeTextResponse"
        "400":
          description: >
            KNOWLEDGE_TEXT_EXTRACT_REJECTED — indexing-runtime rejected the
            upload: an unsupported format ("이 형식은 추천을 지원하지
            않습니다") or an empty extraction result, or a payload exceeding
            the upload size cap. Registration itself is unaffected; the
            caller should fall back to manual entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: >
            Two distinguishable causes, both reported as 503 but with
            DIFFERENT `error.code`/`error.message` — a caller must not
            collapse them, since only one is fixable by an operator:
            `KNOWLEDGE_TEXT_EXTRACT_UNAVAILABLE` (indexing-runtime
            unreachable, or a genuine downstream 5xx) vs.
            `KNOWLEDGE_TEXT_EXTRACT_DEPENDENCY_MISSING` (the format IS
            supported, but this deployment hasn't installed the optional
            `pypdf`/`python-docx` dependency — 서버에 PDF/Word 추출
            의존성이 설치되어 있지 않습니다, D-073). Registration itself
            never depends on this endpoint succeeding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

