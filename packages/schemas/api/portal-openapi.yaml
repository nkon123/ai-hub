          items:
            type: object
            properties:
              knowledge_id:
                type: string
                format: uuid
              asset_name:
                type: string
        model_alias:
          type: string

    DeploymentRevisionListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentRevisionSummary"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    CreateDistributionRequest:
      type: object
      description: 07-data-api-contracts.md §3.8 DistributionRequest fields. `requested_by` is derived from the authenticated caller, never client-supplied.
      required: [root_type, root_id, mode]
      properties:
        root_type:
          type: string
          enum: [ASSET_VERSION, SERVICE_VERSION]
        root_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [ONLINE, OFFLINE_BUNDLE]
          description: Only OFFLINE_BUNDLE is implemented; ONLINE is rejected with a Korean "미구현" message.
        target_site_id:
          type: string
        office_profile_version_id:
          type: string
          format: uuid

    CreateDistributionResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]

    DistributionRequest:
      type: object
      required: [id, root_type, root_id, mode, requested_by, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        root_type:
          type: string
          enum: [ASSET_VERSION, SERVICE_VERSION]
        root_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [ONLINE, OFFLINE_BUNDLE]
        target_site_id:
          type: string
        office_profile_version_id:
          type: string
          format: uuid
        requested_by:
          type: string
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        stage:
          type: string
          enum: [RESOLVING, COLLECTING, VERIFYING, PACKAGING, SUCCEEDED]
        error_code:
          type: string
        error_message:
          type: string
        affected_assets:
          type: array
          items:
            type: string
        retryable:
          type: boolean
        bundle_object_id:
          type: string
        bundle_size_bytes:
          type: integer
        bundle_checksum:
          type: string
        manifest_summary:
          type: object
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DistributionListResponse:
      type: object
      description: 07-data-api-contracts.md §5.3 목록 응답. Non-ADMIN/AUDITOR callers only receive their own requests (same scoping as GET /api/v1/distributions/{distribution_id}).
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DistributionRequest"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    DownloadHistoryEntry:
      type: object
      description: >-
        07-data-api-contracts.md / 01-portal-and-distribution.md §2 P13. One
        row is either a Bundle 요청 (kind=BUNDLE_REQUEST, sourced from
        DistributionRequest) or an actual download attempt
        (kind=DOWNLOAD, sourced from AuditEvent) — never both for the same
        underlying action. Any field genuinely unavailable for a row (e.g.
        client_ip on rows that predate its capture) is omitted/null, never a
        fabricated value; the Portal renders that as "미기재".
      required: [id, kind, distribution_id, user, requested_at, outcome]
      properties:
        id:
          type: string
          description: 'Row identifier, e.g. "request:<distribution_id>" or "download:<audit_event_id>".'
        kind:
          type: string
          enum: [BUNDLE_REQUEST, DOWNLOAD]
        distribution_id:
          type: string
          format: uuid
        user:
          type: string
        organization:
          type: string
        target_site:
          type: string
        root_type:
          type: string
          enum: [ASSET_VERSION, SERVICE_VERSION]
        root_id:
          type: string
          format: uuid
        asset_name:
          type: string
        version:
          type: string
        mode:
          type: string
          enum: [ONLINE, OFFLINE_BUNDLE]
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        client_ip:
          type: string
          description: >-
            Minimal audit-only Client IP capture (P13 "Client IP 또는 기기
            정보의 최소 감사값"), recorded only on DOWNLOAD rows. Never
            populated for BUNDLE_REQUEST rows, and null on DOWNLOAD rows
            recorded before this capture existed — never guessed.
        outcome:
          type: string
          enum: [SUCCESS, FAILURE, DENIED, CANCELLED, IN_PROGRESS]
        reason:
          type: string
          description: Populated for FAILURE/DENIED rows only.
        trace_id:
          type: string

    DownloadHistoryListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DownloadHistoryEntry"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    AuditEvent:
      type: object
      required: [id, timestamp, event_type, actor_type, actor_id, resource_type, resource_id, result]
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        event_type:
          type: string
        actor_type:
          type: string
        actor_id:
          type: string
        organization_id:
          type: string
        site_id:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        resource_version:
          type: string
        trace_id:
          type: string
        run_id:
          type: string
        job_id:
          type: string
        result:
          type: string
          enum: [SUCCESS, DENIED, FAILED]
        policy_id:
          type: string
        metadata:
          type: object
          description: Sanitized summary only — never prompt text, full documents, or secrets.

    AuditEventListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    EvaluationSummary:
      type: object
      description: List-row shape for GET .../evaluations — no per_case detail (see EvaluationDetail for that).
      required: [id, asset_version_id, status, requested_by, created_at, trace_id]
      properties:
        id: { type: string, format: uuid }
        asset_version_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        error_message: { type: string }
        dataset_id: { type: string }
        dataset_version: { type: string }
        dataset_review_status: { type: string, enum: [AI_GENERATED_UNREVIEWED, EXPERT_REVIEWED] }
        evaluated_at: { type: string, format: date-time }
        gate_passed: { type: boolean }
        run_id: { type: string }
        trace_id: { type: string }
        requested_by: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    EvaluationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationSummary"

    CreateEvaluationResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }

    EvaluationMetrics:
      type: object
      description: 04-knowledge-platform.md §4.4 required metrics — evaluation-result.schema.json `metrics` verbatim.
      properties:
        case_count: { type: integer }
        cases_with_ground_truth: { type: integer }
        recall_at_1: { type: number }
        recall_at_5: { type: number }
        mrr: { type: number }
        no_result_rate: { type: number }
        latency_p50_ms: { type: number }
        latency_p95_ms: { type: number }
        avg_context_tokens: { type: number }
        forbidden_hit_rate: { type: number }
        acl_case_count:
          type: integer
          description: >
            Number of ACL Test cases run. 0 means ACL Test was not measured
            for this evaluation (Evaluation Dataset has no acl_cases) — a
            client must not read acl_leak_rate as "safe" when this is 0,
            since the rate is arithmetically 0.0 with no cases either way.
        acl_cases_with_visibility_expectation:
          type: integer
          description: >
            Of acl_case_count, how many declared expected_visible_document_ids.
            If 0, an acl_leak_rate of 0 could just mean search returned
            nothing — that limitation must be surfaced, not hidden.
        acl_leak_rate: { type: number }
        acl_visibility_rate: { type: number }

    EvaluationAclCaseResult:
      type: object
      description: >
        04-knowledge-platform.md §4.4 ACL Test 케이스별 결과 —
        evaluation-result.schema.json `per_acl_case[]` verbatim
        (2026-08-16). Same masking rationale as EvaluationCaseResult — no
        document content, only ids/verdicts/timings.
      properties:
        case_id: { type: string }
        question: { type: string }
        clearance: { type: string }
        forbidden_document_ids:
          type: array
          items: { type: string }
        retrieved_document_ids:
          type: array
          items: { type: string }
        leaked_document_ids:
          type: array
          items: { type: string }
        leaked: { type: boolean }
        expected_visible_document_ids:
          type: array
          items: { type: string }
        missing_visible_document_ids:
          type: array
          items: { type: string }
        visibility_satisfied:
          type: boolean
          nullable: true
          description: >
            null means this case declared no expected_visible_document_ids
            — it asserted nothing about visibility. Must not be rendered
            the same as false (which means a declared expectation was not
            met).
        returned_count: { type: integer }
        latency_ms: { type: integer }
        tags:
          type: array
          items: { type: string }

    PackageSmokeTestCheck:
      type: object
      properties:
        name: { type: string }
        passed: { type: boolean }
        message: { type: string }
        not_run:
          type: boolean
          description: >
            A NOT_RUN check is neither pass nor a normal fail — it must be
            rendered as its own third state, never collapsed into PASS or
            FAIL.

    PackageSmokeTestReport:
      type: object
      description: >
        04-knowledge-platform.md §4.7 Package Smoke Test — passthrough of
        packages/knowledge-packager's `package-knowledge verify
        --report-out` result as admitted (or rejected) by
        evaluation_runner. Always null until a CLI evaluation run attaches
        one via `--smoke-test-report`; portal-api's own evaluation job does
        not build a Knowledge Package.
      properties:
        passed: { type: boolean }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/PackageSmokeTestCheck"
        knowledge_asset_version_id: { type: string }
        package_dir: { type: string }
        verified_at: { type: string, format: date-time }
        admitted:
          type: boolean
          description: >
            False means the report's knowledge_asset_version_id did not
            match the Knowledge being evaluated — this report was not used
            for this evaluation's gate decision. See rejection_reason.
        rejection_reason:
          type: string
          nullable: true
        identity_verified:
          type: boolean
          description: >
            Whether knowledge_asset_version_id could be read from the
            package at all. False does not necessarily mean rejected —
            see admitted for whether the gate actually used this report.

    EvaluationGateCheck:
      type: object
      properties:
        name: { type: string }
        passed: { type: boolean }
        actual: { type: number }
        threshold: { type: number }
        comparison: { type: string }
        message: { type: string }

    EvaluationGate:
      type: object
      properties:
        passed: { type: boolean }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationGateCheck"

    EvaluationCaseResult:
      type: object
      description: >
        07-... P12 "평가 질문별 기대 문서와 검색 결과". None of these fields is
        document content (excerpt/full text) — `question` is dataset-author
        text and the rest are ids/verdicts/timings — so nothing here is
        masked; every authenticated role sees the same values (see
        open-decisions.md D-056).
      properties:
        case_id: { type: string }
        question: { type: string }
        expected_document_ids:
          type: array
          items: { type: string }
        retrieved_document_ids:
          type: array
          items: { type: string }
        hit_at_1: { type: boolean }
        hit_at_5: { type: boolean }
        reciprocal_rank: { type: number }
        latency_ms: { type: integer }
        returned_count: { type: integer }
        context_tokens: { type: integer }
        forbidden_hit: { type: boolean }
        tags:
          type: array
          items: { type: string }

    EvaluationComparison:
      type: object
      description: 04-knowledge-platform.md §4.6 버전 비교. `available=false` means there is no prior version's evaluation to compare against (or its dataset doesn't match) — the UI must say so plainly, never render an empty diff as "변화 없음".
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: string, description: Set when available=false. }
        baseline_evaluation_id: { type: string, format: uuid }
        baseline_asset_version_id: { type: string }
        recall_at_1_delta: { type: number }
        recall_at_5_delta: { type: number }
        mrr_delta: { type: number }
        latency_p95_delta_ms: { type: number }
        no_result_rate_delta: { type: number }
        improved_case_ids:
          type: array
          items: { type: string }
        regressed_case_ids:
          type: array
          items: { type: string }
        new_case_ids:
          type: array
          items: { type: string }
        removed_case_ids:
          type: array
          items: { type: string }
        recommendation: { type: string }
        blocking_reasons:
          type: array
          items: { type: string }

    EvaluationNote:
      type: object
      required: [id, evaluation_result_id, author_id, author_role, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        evaluation_result_id: { type: string, format: uuid }
        author_id: { type: string }
        author_role: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    CreateEvaluationNoteRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2048 }

    EvaluationDetail:
      allOf:
        - $ref: "#/components/schemas/EvaluationSummary"
        - type: object
          properties:
            source_masking_note:
              type: string
              description: >
                States plainly that the stored evaluation result carries no
                document content, so no masking is applied to per_case today
                (open-decisions.md D-056). Same text for every role — not a
                per-role masking indicator.
            retrieval_settings:
              type: object
              properties:
                top_k: { type: integer }
                alpha: { type: number }
                knowledge_version: { type: string }
            metrics:
              $ref: "#/components/schemas/EvaluationMetrics"
            gate:
              $ref: "#/components/schemas/EvaluationGate"
            per_case:
              type: array
              items:
                $ref: "#/components/schemas/EvaluationCaseResult"
            per_acl_case:
              type: array
              items:
                $ref: "#/components/schemas/EvaluationAclCaseResult"
              description: >
                Empty when metrics.acl_case_count is 0 (ACL Test not
                measured for this evaluation) — not evidence of safety.
            package_smoke_test:
              $ref: "#/components/schemas/PackageSmokeTestReport"
              nullable: true
              description: null when no Package Smoke Test report was submitted with this evaluation run.
            comparison:
              $ref: "#/components/schemas/EvaluationComparison"
            known_limitations:
              type: array
              items: { type: string }
              description: Real, already-recorded limitations only (e.g. dataset review_status, out-of-scope gate criteria) — never fabricated.
            notes:
              type: array
              items:
                $ref: "#/components/schemas/EvaluationNote"

    NotImplementedInfo:
      type: object
      description: >
        Recorded reason a P15 sub-area has no editor/data instead of an
        empty form or a guessed value (01-portal-and-distribution.md §2
        P15).
      required: [reason, decision_id]
      properties:
        reason: { type: string }
        decision_id:
          type: string
          description: open-decisions.md id this gap is tracked under.

    RolePermissionRow:
      type: object
      required: [role, permissions]
      properties:
        role: { type: string }
        permissions:
          type: array
          items: { type: string }

    UserRoleMappingSection:
      type: object
      description: >
        The real Role→Permission matrix (security_policy.ROLE_PERMISSIONS,
        7 roles). There is no user directory in this PoC (no `users` table)
        — this section shows what each role *can do*, not who holds it.
      required: [status, source, roles, note]
      properties:
        status: { type: string, enum: [AVAILABLE] }
        source: { type: string }
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RolePermissionRow"
        note: { type: string }

    OrganizationSiteSection:
      type: object
      required: [status, not_implemented]
      properties:
        status: { type: string, enum: [NOT_IMPLEMENTED] }
        not_implemented:
          $ref: "#/components/schemas/NotImplementedInfo"

    ModelAliasSetting:
      type: object
      required: [alias, provider, model_id, endpoint]
      properties:
        alias: { type: string }
        provider: { type: string }
        model_id: { type: string }
        endpoint:
          type: string
          description: Redacted to ***REDACTED*** if it looks credential-shaped (security_policy.redact_if_secret).
        max_context_tokens: { type: integer }

    McpServerAliasSetting:
      type: object
      required: [alias, endpoint]
      properties:
        alias: { type: string }
        endpoint: { type: string }
        allowed_tools:
          type: array
          items: { type: string }

    OfficeProfileSection:
      type: object
      description: services/agent-runtime/config/office-profile-default/office-profile.json, read fresh at request time.
      required: [status, source, name, version, org, sites]
      properties:
        status: { type: string, enum: [AVAILABLE] }
        source: { type: string }
        name: { type: string }
        version: { type: string }
        org: { type: string }
        sites:
          type: array
          items: { type: string }
        max_classification_allowed: { type: string }
        audit_retention_days: { type: integer }

    ModelEndpointAliasSection:
      type: object
      description: 허용 모델과 Endpoint Alias — same office-profile.json source as OfficeProfileSection.
      required: [status, source, model_aliases, mcp_servers]
      properties:
        status: { type: string, enum: [AVAILABLE] }
        source: { type: string }
        model_aliases:
          type: array
          items:
            $ref: "#/components/schemas/ModelAliasSetting"
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/McpServerAliasSetting"

    AssetSizeExtensionPolicySection:
      type: object
      description: >
        Two real, independent policies — knowledge_packager's build-time
        content scanner (extension/pattern based) and the Desktop
        offline-bundle installer's pre-extraction checks (byte-size based).
        Portal 자산 등록 자체(POST /api/v1/assets)에는 별도 크기/확장자 제한이
        없다는 사실도 함께 보고한다(추측하지 않음).
      required: [status, source, portal_upload_limit_note]
      properties:
        status: { type: string, enum: [AVAILABLE] }
        source: { type: string }
        portal_upload_limit_note: { type: string }
        knowledge_package_forbidden_filenames:
          type: array
          items: { type: string }
        knowledge_package_fail_on_fatal: { type: boolean }
        desktop_bundle_max_total_uncompressed_bytes: { type: integer }
        desktop_bundle_max_single_file_uncompressed_bytes: { type: integer }
        desktop_bundle_max_compression_ratio: { type: number }
        desktop_bundle_forbidden_archive_extensions:
          type: array
          items: { type: string }
        desktop_bundle_forbidden_executable_extensions:
          type: array
          items: { type: string }
        parse_error:
          type: string
          description: Set (in place of the desktop_bundle_*/knowledge_package_* fields above) if either source file is missing or no longer matches the expected shape — never a guessed value.

    ApprovalWorkflowSection:
      type: object
      description: security_policy's TECHNICAL→SECURITY→RELEASE chain + the ServiceVersion publish gate flag (D-063).
      required: [status, source, stage_chain, require_service_version_approval, require_service_version_approval_source]
      properties:
        status: { type: string, enum: [AVAILABLE] }
        source: { type: string }
        stage_chain:
          type: array
          items: { type: string }
        require_service_version_approval: { type: boolean }
        require_service_version_approval_source: { type: string }

    SecurityClassificationSubsection:
      type: object
      required: [status, source, classification_levels, acl_metadata_fields, allow_unknown_classification, allow_unknown_classification_caveat]
      properties:
        status: { type: string, enum: [AVAILABLE] }
        source: { type: string }
        classification_levels:
          type: array
          items: { type: string }
        acl_metadata_fields:
          type: array
          items: { type: string }
        allow_unknown_classification: { type: boolean }
        allow_unknown_classification_caveat: { type: string }

    RetentionSubsection:
      type: object
      required: [status, not_implemented]
      properties:
        status: { type: string, enum: [NOT_IMPLEMENTED] }
        not_implemented:
          $ref: "#/components/schemas/NotImplementedInfo"

    SecurityClassificationRetentionSection:
      type: object
      description: 보안등급과 보관기간 — one P15 bullet, two independent statuses (등급 real, 보관기간 미구현).
      required: [classification, retention]
      properties:
        classification:
          $ref: "#/components/schemas/SecurityClassificationSubsection"
        retention:
          $ref: "#/components/schemas/RetentionSubsection"

    PackageTrustSignatureSection:
      type: object
      required: [status, not_implemented]
      properties:
        status: { type: string, enum: [NOT_IMPLEMENTED] }
        not_implemented:
          $ref: "#/components/schemas/NotImplementedInfo"

    IndexingEmbeddingModelSection:
      type: object
      description: >
        P15의 유일한 편집 가능 하위 영역(D-065 UPDATE). configured_model이 null이면
        indexing-runtime 자체 기본값(EMBED_MODEL 설정)이 적용된다. 이 설정을 바꿔도
        이미 만들어진 인덱스는 바뀌지 않는다 — 각 인덱스는 index-meta.json에 기록된
        자신의 embed_model로만 검색된다(search_runtime.hybrid.resolve_embed_model,
        D-075). 기존 Knowledge에 새 모델을 적용하려면 재인덱싱이 필요하다.
      required: [status, source, configured_model, note]
      properties:
        status: { type: string, enum: [AVAILABLE] }
        source: { type: string }
        configured_model:
          type: string
          nullable: true
          description: null이면 indexing-runtime의 자체 기본값이 사용됨(미설정).
        updated_at: { type: string, format: date-time, nullable: true }
        updated_by: { type: string, nullable: true }
        note: { type: string }

    EmbeddingModelInfo:
      type: object
      required: [name, embedding_capable]
      properties:
        name: { type: string }
        embedding_capable:
          type: boolean
          description: >
            이름/Ollama family 메타데이터 기반 휴리스틱(Ollama API가 모델의 용도를
            명시적으로 노출하지 않음) — indexing_runtime.main의 판정 로직 참고.
        size: { type: integer, nullable: true }
        modified_at: { type: string, nullable: true }

    EmbeddingModelsOut:
      type: object
      required: [models, default_embed_model, source, trace_id]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/EmbeddingModelInfo"
        default_embed_model:
          type: string
          description: indexing-runtime의 INDEXING_EMBED_MODEL 설정 현재값(미설정 시 적용될 값).
        source: { type: string }
        trace_id: { type: string }

    IndexingEmbeddingModelUpdateRequest:
      type: object
      required: [model]
      properties:
        model: { type: string, minLength: 1 }

    ChatModelSection:
      type: object
      description: >
        P15의 편집 가능 하위 영역(D-092). configured_model이 null이면 agent-runtime
        자체 기본값(AGENT_RUNTIME_CHAT_MODEL_ID 환경변수, 미설정 시 office-profile.json의
        model_aliases["default-chat"].model_id)이 적용된다(D-091). 이 설정을 바꿔도
        이미 실행 중인 Run에는 즉시 적용되지 않는다(TTL 캐시 경계) — 새 Run부터 적용된다.
      required: [status, source, configured_model, note]
      properties:
        status: { type: string, enum: [AVAILABLE] }
        source: { type: string }
        configured_model:
          type: string
          nullable: true
          description: null이면 agent-runtime의 자체 기본값이 사용됨(미설정).
        updated_at: { type: string, format: date-time, nullable: true }
        updated_by: { type: string, nullable: true }
        note: { type: string }

    ChatModelInfo:
      type: object
      required: [name, chat_capable]
      properties:
        name: { type: string }
        chat_capable:
          type: boolean
          description: >
            agent-runtime(GET /local/v1/models)이 보고하는 채팅 가능 여부 — 임베딩
            전용 모델은 false.
        size: { type: integer, nullable: true }
        modified_at: { type: string, nullable: true }

    ChatModelsOut:
      type: object
      required: [models, default_chat_model, source, trace_id]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ChatModelInfo"
        default_chat_model:
          type: string
          description: agent-runtime의 채팅 모델 기본값 현재값(미설정 시 적용될 값).
        source: { type: string }
        trace_id: { type: string }

    ChatModelUpdateRequest:
      type: object
      required: [model]
      properties:
        model: { type: string, minLength: 1 }

    ChatModelSettingOut:
      type: object
      description: >
        D-092 — agent-runtime이 server-to-server로 조회하는 고정 계약. 필드 추가/변경
        시 agent-runtime 어댑터와 함께 별도 계약 변경 PR로 진행한다.
      required: [configured_model, trace_id]
      properties:
        configured_model:
          type: string
          nullable: true
          description: null이면 agent-runtime 자체 기본값이 적용됨(미설정).
        trace_id: { type: string }

    AdminSettingsOut:
      type: object
      required:
        - generated_at
        - trace_id
        - user_role_mapping
        - organization_site
        - office_profile
        - model_endpoint_alias
        - asset_size_extension_policy
        - approval_workflow
        - security_classification_retention
        - package_trust_signature
        - indexing_embedding_model
        - chat_model
      properties:
        generated_at: { type: string, format: date-time }
        trace_id: { type: string }
        user_role_mapping:
          $ref: "#/components/schemas/UserRoleMappingSection"
        organization_site:
          $ref: "#/components/schemas/OrganizationSiteSection"
        office_profile:
          $ref: "#/components/schemas/OfficeProfileSection"
        model_endpoint_alias:
          $ref: "#/components/schemas/ModelEndpointAliasSection"
        asset_size_extension_policy:
          $ref: "#/components/schemas/AssetSizeExtensionPolicySection"
        approval_workflow:
          $ref: "#/components/schemas/ApprovalWorkflowSection"
        security_classification_retention:
          $ref: "#/components/schemas/SecurityClassificationRetentionSection"
        package_trust_signature:
          $ref: "#/components/schemas/PackageTrustSignatureSection"
        indexing_embedding_model:
          $ref: "#/components/schemas/IndexingEmbeddingModelSection"
        chat_model:
          $ref: "#/components/schemas/ChatModelSection"

    RuntimeModel:
      type: object
      description: Mirrors `packages/schemas/manifests/runtime-model-manifest.schema.json` (D-093) minus internal file-path fields.
      required:
        - model_id
        - display_name
        - purpose
        - version
        - file_size_bytes
        - sha256
        - has_modelfile
        - upload_status
        - registered_at
      properties:
        model_id: { type: string }
        display_name: { type: string }
        purpose: { type: string, enum: [chat, embedding] }
        version: { type: string }
        source_model: { type: string }
        description: { type: string }
        file_size_bytes: { type: integer }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        has_modelfile: { type: boolean }
        upload_status:
          type: string
          enum: [PENDING, READY]
          description: PENDING — registered but the artifact copy isn't complete yet; download/modelfile endpoints answer 409 RUNTIME_MODEL_NOT_READY while in this state.
        registered_at: { type: string, format: date-time }

    RuntimeModelListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeModel"
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
