      type: object
      required: [id, version_id, reason, approver_id, effective_at, created_at, effective]
      properties:
        id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        reason:
          type: string
        approver_id:
          type: string
        effective_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        trace_id:
          type: string
        effective:
          type: boolean
          description: Computed at read time — `effective_at <= now()`.

    AssetVersionRevocationSummary:
      type: object
      required: [effective_at]
      description: |
        D-072: catalog-facing revocation summary exposed via
        `AssetVersion.active_revocation` on GET /assets and GET
        /assets/{asset_id}. Deliberately smaller than
        `AssetVersionRevocation` (the P16 lifecycle screen's shape, gated by
        `LIFECYCLE_READ`): `reason` here is included only when the caller
        also holds `LIFECYCLE_READ` (RELEASE_MANAGER/AUDITOR/ADMIN) — plain
        `ASSET_READ` callers (every role, including Desktop's `USER`
        identity) get a null reason instead of the free-text explanation,
        so this endpoint doesn't silently widen a boundary the lifecycle
        screen already draws.
      properties:
        effective_at:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true

