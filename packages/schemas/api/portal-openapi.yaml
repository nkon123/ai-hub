        deployment is not ACTIVE, so the response never reveals slug
        existence (spec 10-hosted-chatbot-publication.md §9).
      operationId: get_deployment_by_slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBySlugResponse"
        "404":
          description: Deployment not found or not active (indistinguishable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/deployments/{deployment_id}/publish:
    post:
      tags: [deployments]
      summary: Publish deployment — creates immutable revision and issues URL
      description: |
        Runs the same publish-gate checks as `POST /service-versions/{id}/validate`
        before snapshotting. When the server setting `require_service_version_approval`
        is `true` (default `false` for this PoC — open-decisions.md D-063), an
        additional `service_version_review_status` check refuses publish with
        `DEPLOYMENT_VALIDATION_FAILED` unless the target ServiceVersion's D-041
        후속 검토 체인 has reached `APPROVED`. When the setting is `false`, this
        check never blocks publish but is still reported (never silently
        hidden) so the caller can see whether the version was actually reviewed.
      operationId: publish_deployment
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "202":
          description: Publish job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishJobResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/deployments/{deployment_id}/suspend:
    post:
      tags: [deployments]
      summary: Suspend an ACTIVE deployment — blocks new Chat Session creation (RELEASE_MANAGER)
      operationId: suspend_deployment
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendRequest"
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Deployment is not ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/deployments/{deployment_id}/resume:
    post:
      tags: [deployments]
      summary: Resume a SUSPENDED deployment after re-validating its active revision (RELEASE_MANAGER)
      operationId: resume_deployment
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          description: Re-validation failed (e.g. bound Knowledge no longer APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Deployment is not SUSPENDED, or has no revision to resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/deployments/{deployment_id}/rollback:
    post:
      tags: [deployments]
      summary: Roll back to an earlier DeploymentRevision (RELEASE_MANAGER)
      operationId: rollback_deployment
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "200":
          description: Rolled back — active_revision_id now points at the target revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No earlier revision available, or target_revision_id does not belong to this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/deployments/{deployment_id}/retire:
    post:
      tags: [deployments]
      summary: Retire a deployment permanently — terminal, no path back (RELEASE_MANAGER)
      description: >
        §8 게시 수명주기: ACTIVE/SUSPENDED -> RETIRED. Terminal by design —
        resume, rollback, update and re-publish all refuse a RETIRED
        deployment, and the slug stays reserved so the URL can never be
        silently reused by a different chatbot. Revision history is kept for
        audit; only its status changes.
      operationId: retire_deployment
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetireDeploymentRequest"
      responses:
        "200":
          description: Retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Deployment is already RETIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/deployments/{deployment_id}/revisions:
    post:
      tags: [deployments]
      summary: Update a live deployment to a new Service Version as a new revision (RELEASE_MANAGER)
      description: >
        §8 "Service Version 변경은 새 Deployment Revision으로 수행한다" and
        HOST-022 "Update 실패 시 기존 Version을 유지한다". The target version
        goes through the same publish Gate as `/publish`; when it fails,
        nothing changes — the previously active revision stays ACTIVE and
        serving. The update itself is a single synchronous transaction, so
        the deployment is never observably in an intermediate state.
      operationId: update_deployment_revision
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeploymentRequest"
      responses:
        "201":
          description: Updated — a new revision is ACTIVE and the previous one is SUPERSEDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          description: Gate 검증 실패 (기존 Revision 유지) 또는 요청 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Deployment is not ACTIVE/SUSPENDED, the target version belongs to
            another Service, or it is already the active version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [deployments]
      summary: List this deployment's revisions (revision_number desc) as rollback candidates
      operationId: list_deployment_revisions
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentRevisionListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/distributions:
    get:
      tags: [distributions]
      summary: List Distribution/Bundle requests (newest first). Non-ADMIN/AUDITOR callers only see requests they made themselves.
      operationId: list_distributions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [distributions]
      summary: Request an Offline Bundle for an approved Asset/Service Version (OFFLINE_BUNDLE only; ONLINE mode is rejected as unimplemented)
      operationId: create_distribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDistributionRequest"
      responses:
        "202":
          description: Distribution job accepted (QUEUED — processing continues asynchronously)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDistributionResponse"
        "400":
          description: Invalid request (unsupported mode, or root version not APPROVED/not yet published)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/distributions/download-history:
    get:
      tags: [distributions]
      summary: >-
        P13 다운로드 이력 — merged view of Bundle 요청(DistributionRequest) and
        actual 다운로드(AuditEvent) rows, newest first. Non-ADMIN/AUDITOR
        callers only see rows where they are the actor; AUDITOR/ADMIN see
        every row. Registered before /{distribution_id} so the literal path
        "download-history" is never captured as a distribution_id.
      operationId: list_download_history
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: from
          in: query
          description: Filter by requested/occurred timestamp, inclusive lower bound.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Filter by requested/occurred timestamp, inclusive upper bound.
          schema:
            type: string
            format: date-time
        - name: mode
          in: query
          schema:
            type: string
            enum: [ONLINE, OFFLINE_BUNDLE]
        - name: outcome
          in: query
          schema:
            type: string
            enum: [SUCCESS, FAILURE, DENIED, CANCELLED, IN_PROGRESS]
        - name: actor_id
          in: query
          description: AUDITOR/ADMIN only — any other role requesting a different actor_id is denied (PERMISSION_DENIED) and audited.
          schema:
            type: string
        - name: organization_id
          in: query
          description: AUDITOR/ADMIN only — same denial rule as actor_id.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadHistoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/distributions/{distribution_id}:
    get:
      tags: [distributions]
      summary: Get Distribution/Bundle job status, stage, error, and bundle metadata
      operationId: get_distribution
      parameters:
        - $ref: "#/components/parameters/DistributionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/distributions/{distribution_id}/download:
    get:
      tags: [distributions]
      summary: Download the finished Offline Bundle ZIP (only when status=SUCCEEDED)
      operationId: download_distribution
      parameters:
        - $ref: "#/components/parameters/DistributionId"
      responses:
        "200":
          description: Bundle ZIP stream
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Bundle not ready yet (job not SUCCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/audit-events:
    get:
      tags: [audit]
      summary: Search audit events (AUDITOR/ADMIN only)
      operationId: list_audit_events
      parameters:
        - name: resource_id
          in: query
          schema:
            type: string
        - name: event_type
          in: query
          schema:
            type: string
        - name: actor_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/settings:
    get:
      tags: [admin]
      summary: >
        P15 관리자 설정 — read-only "정책·구성 현황". Every section is either
        AVAILABLE (sourced live from its real config/policy file at request
        time, never a hand-maintained copy) or NOT_IMPLEMENTED (named reason
        + open-decisions.md id, never an empty form or a guessed value).
        ADMIN only. Never returns a live/original credential value — any
        config field that could hold one is redacted (see
        AdminSettingsOut.redaction_note on each section that reads a file).
      operationId: get_admin_settings
      responses:
        "200":
          description: Effective platform configuration snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/embedding-models:
    get:
      tags: [admin]
      summary: >
        P15 인덱싱 임베딩 모델 설정 — Ollama에 실제 설치된 모델 목록(indexing-runtime의
        GET /indexing/v1/models를 그대로 proxy). portal-api는 모델을 직접 호출하지
        않으므로(CLAUDE.md) indexing-runtime을 경유한다. Ollama에 연결할 수 없으면
        빈 목록이 아니라 명확한 오류를 반환한다(D-075). ADMIN only.
      operationId: list_embedding_models
      responses:
        "200":
          description: Ollama에 설치된 모델 목록과 임베딩 가능 여부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingModelsOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: indexing-runtime 또는 Ollama에 연결할 수 없음 (MODEL_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/admin/indexing-embedding-model:
    put:
      tags: [admin]
      summary: >
        신규 Knowledge 인덱싱에 사용할 임베딩 모델을 설정한다. portal.db의
        platform_settings에 저장되며, 이미 만들어진 인덱스에는 영향을 주지 않는다
        (각 인덱스는 index-meta.json에 기록된 자신의 embed_model로만 검색됨, D-075).
        GET /api/v1/admin/embedding-models가 임베딩 가능으로 보고하지 않는 모델은
        거부한다(VALIDATION_ERROR). ADMIN only, 감사 기록.
      operationId: set_indexing_embedding_model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexingEmbeddingModelUpdateRequest"
      responses:
        "200":
          description: 저장된 설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingEmbeddingModelSection"
        "400":
          description: 요청한 모델이 Ollama에서 임베딩 가능 모델로 확인되지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: indexing-runtime 또는 Ollama에 연결할 수 없어 검증할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/admin/chat-models:
    get:
      tags: [admin]
      summary: >
        P15 채팅 모델 설정(D-092) — Ollama에 실제 설치된 모델 목록(agent-runtime의
        GET /local/v1/models를 그대로 proxy). portal-api는 모델을 직접 호출하지
        않으므로(CLAUDE.md) agent-runtime을 경유한다. agent-runtime에 연결할 수 없으면
        빈 목록이 아니라 명확한 오류를 반환한다. ADMIN only.
      operationId: list_chat_models
      responses:
        "200":
          description: Ollama에 설치된 모델 목록과 채팅 가능 여부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatModelsOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: agent-runtime 또는 Ollama에 연결할 수 없음 (MODEL_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/admin/chat-model:
    put:
      tags: [admin]
      summary: >
        신규 Run에 사용할 채팅 모델을 설정한다(D-092, D-091 사고 대응). portal.db의
        platform_settings에 저장되며, 이미 실행 중인 Run에는 즉시 적용되지 않는다
        (TTL 캐시 경계). GET /api/v1/admin/chat-models가 채팅 가능으로 보고하지 않는
        모델은 거부한다(VALIDATION_ERROR) — 설치되지 않은 모델이 설정되어 실행
        시점까지 아무도 모르는 사고를 구조적으로 막는다. ADMIN only, 감사 기록.
      operationId: set_chat_model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatModelUpdateRequest"
      responses:
        "200":
          description: 저장된 설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatModelSection"
        "400":
          description: 요청한 모델이 설치된 채팅 가능 모델로 확인되지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: agent-runtime 또는 Ollama에 연결할 수 없어 검증할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/admin/chat-model-setting:
    get:
      tags: [admin]
      summary: >
        D-092 — agent-runtime이 server-to-server로 조회하는 현재 채팅 모델 설정.
        관리자 화면용이 아니다(그건 GET /api/v1/admin/settings의 chat_model 절).
        ADMIN_SETTINGS_READ를 요구하지 않는다 — agent-runtime은 고정 토큰(D-034
        portal_api_token, role CREATOR)으로 인증하며 그 role은 ADMIN 전용 권한을
        갖지 않는다. 응답 모양은 고정 계약이다(변경 금지).
      operationId: get_chat_model_setting
      responses:
        "200":
          description: 현재 설정(미설정 시 configured_model=null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatModelSettingOut"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/runtime-models:
    get:
      tags: [runtime-models]
      summary: List Ollama-consumable runtime models available for closed-network download
      description: |
        open-decisions.md D-093 — a "런타임 자산", NOT an Asset Registry
        type: no review/approval version chain, listed here purely as a
        platform component catalog (mirrors D-092 treating the chat model
        as a platform setting, not a reviewed business asset). Registration
        is out-of-band in this PoC (an operator places `manifest.json` +
        the GGUF/Modelfile under portal-api's `runtime_model_root`
        directory per `runtime-model-manifest.schema.json`) — there is
        deliberately no `POST` here in this contract slice; Desktop-side
        consumption (`ollama create`) is a separate, later piece of work.
        `USER`/`CREATOR` (anyone with `DOWNLOAD_READ`, same permission as
        `GET /api/v1/distributions/{id}/download`) may list — Desktop
        downloads with the user's own token, not an admin-only one.
      operationId: list_runtime_models
      parameters:
        - name: purpose
          in: query
          schema:
            type: string
            enum: [chat, embedding]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeModelListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/runtime-models/{model_id}:
    get:
      tags: [runtime-models]
      summary: Runtime model detail
      operationId: get_runtime_model
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            `RESOURCE_NOT_FOUND` — no `model_id` directory/manifest.json
            under `runtime_model_root` at all. Distinct from the 409 below,
            which means the model IS registered but not yet ready.
          $ref: "#/components/responses/NotFound"

  /api/v1/runtime-models/{model_id}/download:
    get:
      tags: [runtime-models]
      summary: Download the GGUF weight file (HTTP Range resume supported)
      description: |
        Streams the model file — never buffered fully in memory
        (`FileResponse`, chunked reads). Supports standard HTTP `Range`
        requests for interrupted-transfer resume (root spec: "sha256
        체크섬 + HTTP Range 이어받기 + 진행률·취소").

        **Checksum timing**: `sha256` (exposed as both the JSON body field
        on `GET /api/v1/runtime-models/{model_id}` and the
        `X-Content-Sha256` response header here) is computed once, offline,
        against the original artifact at registration time — this proves
        the file wasn't corrupted *at rest* since registration. It is
        NOT recomputed by the server on every request (hashing a 5GB file
        per call would make every request O(file size)). The caller is
        responsible for re-hashing the fully assembled bytes after
        download/resume completes and comparing against this value to
        catch transit corruption — that verification step lives in the
        consumer (Desktop, out of scope for this contract slice), not here.

        **Stale-file-during-resume safety**: this endpoint's `ETag` is the
        file's `sha256` (not a size+mtime tag), so a resuming client MUST
        send `If-Range: <etag-from-the-earlier-response>` on its follow-up
        Range request. If the file on disk was replaced in between (new
        sha256 → new ETag), the mismatched `If-Range` makes the server
        return a fresh **200 with the full file** instead of a `206`
        partial slice of the NEW file stitched onto previously-downloaded
        bytes of the OLD file — this is standard HTTP semantics
        (RFC 9110 §13.1.5), relied on deliberately here instead of
        reinvented. A client that ignores `If-Range` and blindly appends
        bytes can still produce a corrupted file; the sha256 comparison
        after completion is the backstop for that case.

        **Ready vs missing vs not-yet-uploaded**: three distinct outcomes,
        never collapsed —
          - unknown `model_id` → 404 `RESOURCE_NOT_FOUND`
          - `manifest.json` exists but `upload_status != READY` → 409
            `RUNTIME_MODEL_NOT_READY` (registered, still being copied in —
            retry later, this is not a client error)
          - `upload_status == READY` but the file is absent from disk at
            request time → 500 `RUNTIME_MODEL_FILE_MISSING` (deployment
            defect, not something the caller can fix by retrying)

        Range errors (malformed `Range` header, out-of-bounds range) return
        standard HTTP Range semantics (`400`/`416` with a `Content-Range`
        header) rather than the common JSON `ErrorEnvelope` — a deliberate,
        documented exception: Range-aware HTTP clients (resumable
        downloaders, browsers) act on the status code and `Content-Range`
        header, not a JSON body, for this class of error.
      operationId: download_runtime_model
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: Standard HTTP byte-range, e.g. `bytes=1048576-`
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
          description: Must be the ETag (quoted sha256) obtained from a prior response, to safely resume across a possible file replacement.
      responses:
        "200":
          description: Full file, streamed
          headers:
            X-Content-Sha256:
              schema: { type: string }
            ETag:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string }
        "206":
          description: Partial content for the requested byte range
          headers:
            Content-Range:
              schema: { type: string }
            X-Content-Sha256:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`RUNTIME_MODEL_NOT_READY` — registered but upload not yet complete"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "416":
          description: Range Not Satisfiable (standard HTTP semantics, not ErrorEnvelope — see summary)
        "500":
          description: "`RUNTIME_MODEL_FILE_MISSING` — manifest says READY but the file is absent on disk"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/runtime-models/{model_id}/modelfile:
    get:
      tags: [runtime-models]
      summary: Fetch the Ollama Modelfile as plain text
      description: |
        Separate from the GGUF download — D-093 requires the Modelfile to
        carry the original model's TEMPLATE/PARAMETER verbatim
        (`ollama show --modelfile`); shipping it as its own small text
        response (not bundled inside the GGUF, not zipped) lets Desktop
        fetch/display/diff it independently and cheaply. Same
        not-found/not-ready/missing-file 3-way distinction as the GGUF
        download applies here, plus one more: `has_modelfile: false` on the
        manifest returns 404 even when the model itself is READY.
      operationId: get_runtime_model_modelfile
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown model_id, or this model has no Modelfile (`has_modelfile=false`)
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`RUNTIME_MODEL_NOT_READY`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "`RUNTIME_MODEL_FILE_MISSING`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  parameters:
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      name: service_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DistributionId:
      name: distribution_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvaluationId:
      name: evaluation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$"

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflict (e.g., version already exists)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    HealthResponse:
      type: object
      required: [status, version, commit_sha]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        commit_sha:
          type: string
          description: Immutable source revision injected by release automation, or unknown in local development

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code:
              type: string
            message:
              type: string
            trace_id:
              type: string
            details:
              type: object

    ListMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    AssetStatus:
      type: string
      enum:
        - DRAFT
        - VALIDATING
        - READY_FOR_REVIEW
        - IN_REVIEW
        - APPROVED
        - REJECTED
        - CHANGES_REQUESTED
        - DEPRECATED
        - RETIRED
        - SUSPENDED

    AssetVersion:
      type: object
      required: [id, asset_id, type, name, version, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        type:
          type: string
        name:
          type: string
        version:
          type: string
        status:
          $ref: "#/components/schemas/AssetStatus"
        classification:
          type: string
        owner:
          type: object
        created_at:
          type: string
          format: date-time
        validation_status:
          type: string
          enum: [NOT_RUN, PASSED, FAILED]
          description: P06 자동검증 결과 — 상태 전이가 아니라 이 필드에만 기록된다.
        validation_errors:
          type: array
          items:
            type: string
        validated_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
        deprecated_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time
        replacement_version_id:
          type: string
          format: uuid
        pending_review_id:
          type: string
          format: uuid
          description: Only populated by GET /assets/{asset_id}, not the catalog list
        active_revocation:
          allOf:
            - $ref: "#/components/schemas/AssetVersionRevocationSummary"
          nullable: true
          description: |
            D-072: null unless this version currently has an *effective*
            revocation (`effective_at <= now()`) — a future-dated
            revocation must not appear here yet, browsing must not show a
            block that hasn't started. Populated by GET /assets and GET
            /assets/{asset_id} (both endpoints Desktop's 자산 스토어 and
            Portal catalog screens use). See
            `AssetVersionRevocationSummary` for why `reason` may be null
            even when this field itself is present.
        manifest:
          type: object
          description: |
            Full manifest JSON as submitted at registration — was already
            returned by every endpoint using this schema (`AssetVersionOut`
            in the implementation), just undocumented here until D-034 made
            `GET /api/v1/asset-versions/{version_id}` a real consumer of it.

    PromptTemplate:
      type: object
      required: [content]
      properties:
        content:
          type: string

    ManifestValidateRequest:
      type: object
      required: [type, manifest]
      properties:
        type:
          type: string
          enum: [agent, knowledge, prompt, mcp_tool, service]
        manifest:
          type: object

    ManifestValidateResponse:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string

    PythonSignatureConvertRequest:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 20000
        function_name:
          type: string
          description: Optional only for callers selecting one function explicitly.

    PythonSignatureParameter:
      type: object
      required: [name, schema_type, required, default_included]
      additionalProperties: false
      properties:
        name: { type: string }
        schema_type: { type: string }
        required: { type: boolean }
        default_included: { type: boolean }

    PythonSignatureDiscarded:
      type: object
      required: [body_statement_count, decorator_count, docstring_present, return_annotation_present, top_level_statement_count, source_persisted, source_executed]
      additionalProperties: false
      properties:
        body_statement_count: { type: integer, minimum: 0 }
        decorator_count: { type: integer, minimum: 0 }
        docstring_present: { type: boolean }
        return_annotation_present: { type: boolean }
        top_level_statement_count: { type: integer, minimum: 0 }
        source_persisted: { type: boolean, const: false }
        source_executed: { type: boolean, const: false }

    PythonSignatureConvertResponse:
      type: object
      required: [function_name, input_schema, parameters, discarded, warnings]
      additionalProperties: false
      properties:
        function_name: { type: string }
        input_schema: { type: object }
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/PythonSignatureParameter"
        discarded:
          $ref: "#/components/schemas/PythonSignatureDiscarded"
        warnings:
          type: array
          items: { type: string }

    KnowledgeSearchRequest:
      type: object
      required: [query]
      description: |
        No ACL/clearance/classification/metadata_filters field exists here
        by design — see the path's `description`. This is intentionally a
        narrower surface than search-runtime's own `SearchRequest`
        (knowledge-search.schema.json), which portal-api calls once per
        visible Knowledge on the caller's behalf.
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
        knowledge_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Restrict the search to these AssetVersion ids (intersected with
            what the caller may see — an id outside that set is silently
            dropped, never an error). Omit to search every APPROVED
            Knowledge the caller can see, capped at a small fan-out
            constant.
        top_k:
          type: integer
          minimum: 1
          maximum: 50
          default: 5

    KnowledgeSearchCitation:
      type: object
      description: |
        Additive superset of search-runtime's own Citation
        (knowledge-search.schema.json#/definitions/Citation) — every field
        it returns is passed through with the same name (e.g. `excerpt`,
        not `text`), plus `knowledge_id`/`asset_id`/`asset_name`/`source`
        stamped on by this endpoint.
      required: [chunk_id, excerpt, score, knowledge_id, asset_id, asset_name, source]
      properties:
        chunk_id:
          type: string
        parent_chunk_id:
          type: string
        document_id:
          type: string
          description: >
            04-knowledge-platform.md §2.6/§3.12 stable document identity,
            echoed from the chunk's indexed metadata. Absent/empty for
            indexes built before search-runtime surfaced it — that means
            "unknown", not "no document", and must not be reconstructed
            from document_path (D-045).
        document_path:
          type: string
        document_title:
          type: string
        page:
          type: integer
        section:
          type: string
        excerpt:
          type: string
        parent_context:
          type: string
        score:
          type: number
        similarity:
          type: ["number", "null"]
        knowledge_id:
          type: string
          format: uuid
          description: The AssetVersion id this citation was found in.
        asset_id:
          type: string
          format: uuid
        asset_name:
          type: string
        source:
          type: string
          enum: [hub]

    KnowledgeSearchResponse:
      type: object
      required: [trace_id, knowledge_ids_searched, citations]
      properties:
        trace_id:
          type: string
        knowledge_ids_searched:
          type: array
          items:
            type: string
            format: uuid
          description: |
            AssetVersion ids this request actually completed a search
            against — excludes any that were visible/requested but whose
            search-runtime call failed (partial failure).
        citations:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSearchCitation"

    SuggestKnowledgeMetadataRequest:
      type: object
      required: [excerpt, filename]
      description: |
        Field names mirror local-runtime-api.yaml's
        SuggestKnowledgeMetadataRequest exactly — portal-api relays this
        body to agent-runtime unchanged.
      properties:
        excerpt:
          type: string
          minLength: 1
        filename:
          type: string
        trace_id:
          type: string

    SuggestKnowledgeMetadataResponse:
      type: object
      required: [suggested_name, suggested_description, trace_id]
      description: |
        A suggestion, not a fact — untrusted model output. The caller must
        render both fields as editable text only.
      properties:
        suggested_name:
          type: string
        suggested_description:
          type: string
        trace_id:
          type: string

    ExtractKnowledgeTextResponse:
      type: object
      required: [excerpt, trace_id]
      description: |
        A BOUNDED plain-text excerpt extracted server-side from a .pdf/.docx
        upload (indexing-runtime enforces the bound) — meant to be fed into
        SuggestKnowledgeMetadataRequest.excerpt unchanged, the same way
        portal-web already handles .md/.txt client-side excerpts.
      properties:
        excerpt:
          type: string
        trace_id:
          type: string

    SearchPreviewRequest:
      type: object
      required: [query]
      description: |
        No metadata_filters/access_context/retrieval_profile field exists
        here by design — same reasoning as KnowledgeSearchRequest, plus
        04-knowledge-platform.md §3.8's explicit ACL-override prohibition.
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        ignore_relevance_threshold:
          type: boolean
          default: false
          description: |
            true sends search-runtime `min_relevance_score: 0` and only
            that — never relaxes ACL/classification filtering.

    SearchPreviewCitation:
      type: object
      description: |
        search-runtime's own Citation shape
        (knowledge-search.schema.json#/definitions/Citation), passed
        through unchanged. Unlike KnowledgeSearchCitation, nothing is
        stamped on here — this endpoint already knows which single
        AssetVersion it searched.
      required: [chunk_id, excerpt, score]
      properties:
        chunk_id:
          type: string
        parent_chunk_id:
          type: string
        document_id:
          type: string
          description: >
            04-knowledge-platform.md §2.6/§3.12 stable document identity,
            echoed from the chunk's indexed metadata. Absent/empty for
            indexes built before search-runtime surfaced it — that means
            "unknown", not "no document", and must not be reconstructed
            from document_path (D-045).
        document_path:
          type: string
        document_title:
          type: string
        page:
          type: integer
        section:
          type: string
        excerpt:
          type: string
        parent_context:
          type: string
        score:
          type: number
        similarity:
          type: ["number", "null"]

    SearchPreviewDiagnostics:
      type: object
      required:
        - index_found
        - min_relevance_score_applied
        - relevance_threshold_ignored
        - clearance_applied
        - retry_without_threshold_available
      properties:
        index_found:
          type: boolean
          description: portal-api's own filesystem check — true regardless of whether the search-runtime call itself succeeded.
        embed_model_applied:
          type: ["string", "null"]
        embed_model_source:
          type: ["string", "null"]
        min_relevance_score_applied:
          type: number
        relevance_threshold_ignored:
          type: boolean
        clearance_applied:
          type: string
        asset_classification:
          type: ["string", "null"]
          description: |
            Registry에 기록된 이 자산의 보안등급. `clearance_applied`와 나란히
            보여주기 위한 값 — 둘을 함께 보여주지 않으면
            CLASSIFICATION_ABOVE_CLEARANCE가 무슨 뜻인지 화면에서 읽을 수 없다.
        no_result_reason:
          type: ["string", "null"]
          enum: [INDEX_NOT_BUILT, CLASSIFICATION_ABOVE_CLEARANCE, NO_CITATIONS, null]
          description: |
            이 호출이 실제로 관측한 것으로만 채운다. "임계값에 걸렸다"는
            단일 호출로 증명할 수 없으므로 서버가 지어내지 않는다 —
            retry_without_threshold_available 참고.
            CLASSIFICATION_ABOVE_CLEARANCE는 예외적으로 단일 호출로 증명
            가능하다: 자산의 기록된 등급과 이 플랫폼이 assert하는 clearance를
            security_policy의 규칙으로 비교한 결과이며, 검색 품질 문제가 아니라
            정책상 전면 차단이라 관련도 필터를 꺼도 결과가 달라지지 않는다
            (그래서 이 경우 retry_without_threshold_available은 false다).
        retry_without_threshold_available:
          type: boolean
          description: |
            True only when citations came back empty, the index was
            found, and this call did not already set
            ignore_relevance_threshold. The UI re-runs with
            ignore_relevance_threshold: true, and only if THAT returns
            citations may it then attribute the empty result to the
            relevance threshold.

    SearchPreviewResponse:
      type: object
      required: [citations, diagnostics, trace_id]
      properties:
        citations:
          type: array
          items:
            $ref: "#/components/schemas/SearchPreviewCitation"
        diagnostics:
          $ref: "#/components/schemas/SearchPreviewDiagnostics"
        trace_id:
          type: string

    DistributionReadinessCheck:
      type: object
      required: [id, status, message]
      properties:
        id:
          type: string
          enum:
            - INDEXING_COMPLETED
            - INDEX_DIR_FOUND
            - INDEX_META_KNOWLEDGE_ID
            - BM25_FORMAT
            - CHROMA_PRESENT
            - EMBED_MODEL_RECORDED
            - CLASSIFICATION_STAMPED
        status:
          type: string
          enum: [PASS, WARN, FAIL]
        message:
          type: string
          description: Korean, user-facing.
        remedy:
          type: ["string", "null"]
          description: A concrete action, e.g. the CLI command to run.
        activation_reason:
          type: ["string", "null"]
          description: |
            The D-079 refusal (knowledge-local-index.schema.json
            RegisterLocalIndexResponse `details.reason`) this check
            predicts, or null when there is none (a pre-install state) or
            the check could not be evaluated (cascaded from an earlier
            FAIL).

    DistributionReadinessResponse:
      type: object
      required: [version_id, ready, checks, trace_id]
      properties:
        version_id:
          type: string
          format: uuid
        ready:
          type: boolean
          description: True only when no check has status FAIL.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DistributionReadinessCheck"
        trace_id:
          type: string

    AssetListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetVersion"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    AssetUploadPolicy:
      type: object
      required:
        [max_single_file_bytes, max_total_request_bytes, max_file_count, rejected_extensions]
      properties:
        max_single_file_bytes:
          type: integer
        max_total_request_bytes:
          type: integer
        max_file_count:
          type: integer
        rejected_extensions:
          type: array
          items:
            type: string

    AssetDetail:
      allOf:
        - $ref: "#/components/schemas/AssetVersion"
        - type: object
          properties:
            versions:
              type: array
              items:
                $ref: "#/components/schemas/AssetVersion"
            dependencies:
              type: array
              items:
                type: object

    CreateAssetRequest:
      type: object
      required: [manifest]
      properties:
        manifest:
          type: object
          description: Asset-type specific manifest object

    CreateAssetVersionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: string
          pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"
          description: SemVer major.minor.patch — must be strictly greater than the source (latest APPROVED) version
        changelog:
          type: string
          maxLength: 4096

    UpdateAssetVersionRequest:
      type: object
      properties:
        changelog:
          type: string
          maxLength: 4096
        manifest_patch:
          type: object
          description: Partial manifest update — only `description`/`tags` are accepted; any other key is rejected with VALIDATION_ERROR
          properties:
            description:
              type: string
              maxLength: 1024
            tags:
              type: array
              items:
                type: string
              maxItems: 20

    ManifestDiffAddedEntry:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value: {}

    ManifestDiffRemovedEntry:
      type: object
